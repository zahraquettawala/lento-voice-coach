<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("lentoTheme")||"neutral"}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lento">
<meta name="theme-color" content="#f6f5f2">
<title>Meet Lento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="icon" href="sloth.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  .scene { min-height: 100svh; max-width: 460px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom)); }
  .say { font-size: 19px; }
  .scene .btn { width: 100%; }
  .skip { font-size: 14px; font-weight: 600; color: var(--ink-3); padding: 6px; }
  .nav { width: 100%; display: flex; align-items: center; gap: 14px; }
</style>
</head>
<body>
<main class="scene">
  <div class="nav"><div class="steps" id="steps"></div><button class="skip" id="skip">Skip</button></div>
  <div class="grow-space"></div>
  <div class="say fade-in" id="say"></div>
  <div class="lento-big sway"><div id="mascot" data-sloth="happy"></div></div>
  <div class="grow-space"></div>
  <button class="btn accent big" id="next">Continue</button>
</main>

<script type="module">
  import { drawSloths, setMood } from "./sloth.js";
  import { speak, unlock } from "./voice.js";
  import { createPiano } from "./piano.js";

  const $ = (id) => document.getElementById(id);
  // One idea per screen, like meeting a new friend
  const STEPS = [
    { mood: "happy", text: "Hi, I'm Lento!", sub: "Lento is the musical word for “slow.” I'm here to help you slow down and make time for singing.",
      voice: "Hi, I'm Lento, your vocal coach. Lento means slow, and that's the idea: slow down, take a breath, and make a little time for singing." },
    { mood: "sing", text: "I sing it first, then it's your turn.", sub: "Warm-ups, scales and your song, with me on the piano. A little different every day.",
      voice: "In every lesson, I sing each exercise first. Then it's your turn, and I'll play piano with you." },
    { mood: "proud", text: "I listen while you sing.", sub: "If a note goes flat, sharp or breathy, we'll go over it together until it feels right.",
      voice: "I listen while you sing. If something's a little off, we'll practice it together until it's right." },
    { mood: "happy", text: "Pop in wired earbuds.", sub: "That way I hear you, not the piano. Nothing is recorded, and your progress stays on this phone.", cta: "Let's sing!",
      voice: "Pop in your earbuds, and let's sing!" },
  ];
  let i = 0, ctx, piano;
  $("steps").innerHTML = STEPS.map(() => "<i></i>").join("");

  function show() {
    const st = STEPS[i];
    $("say").innerHTML = `${st.text}<small>${st.sub}</small>`;
    $("say").classList.remove("fade-in"); void $("say").offsetWidth; $("say").classList.add("fade-in");
    setMood($("mascot"), st.mood);
    [...$("steps").children].forEach((el, j) => el.classList.toggle("on", j <= i));
    $("next").textContent = st.cta ?? "Continue";
  }

  // A slow, warm rolled chord on the grand piano when she first says hi
  async function hello() {
    ctx ??= new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    piano ??= createPiano(ctx);
    const chord = [48, 55, 64, 67, 72, 76];
    await piano.preload(chord);
    const t0 = ctx.currentTime + 0.05;
    chord.forEach((m, k) => piano.play(m, t0 + k * 0.16, 2.6 - k * 0.16, 0.5));
  }

  const done = () => { try { localStorage.setItem("lentoMet", "1"); } catch {} location.href = "./"; };
  $("next").onclick = () => {
    unlock();
    if (i === STEPS.length - 1) return done();
    if (i === 0) hello().catch(() => {});
    i++;
    show();
    speak(STEPS[i].voice);
  };
  $("skip").onclick = done;
  show();
  drawSloths();
</script>
</body>
</html>
