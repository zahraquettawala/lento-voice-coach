<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("lentoTheme")||"neutral"}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lento">
<meta name="theme-color" content="#f6f5f2">
<title>Lento · Vocal coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="icon" href="sloth.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  .scene { min-height: 100svh; padding: max(16px, env(safe-area-inset-top)) 22px calc(104px + env(safe-area-inset-bottom)); max-width: 460px; margin: 0 auto; }
  .top { width: 100%; display: flex; align-items: center; justify-content: space-between; }
  .brand { font-family: var(--serif); font-size: 22px; font-weight: 600; }
  .lento-big { width: 230px; height: 276px; margin-top: 8px; }
  .meta { font-size: 13.5px; color: var(--ink-3); }
  .scene .btn { width: 100%; }
</style>
<script type="module" src="analytics.js"></script>
</head>
<body>
<main class="scene">
  <div class="top">
    <span class="brand">Lento</span>
    <span class="pill" id="streak">0-day streak</span>
  </div>
  <div class="grow-space"></div>
  <div class="say fade-in" id="say">Good evening! Ready to sing?<small id="sub">Warm-up, scales, your song and a cooldown</small></div>
  <div class="lento-big sway"><div data-sloth="happy" id="mascot"></div></div>
  <div class="grow-space"></div>
  <span class="meta" id="meta"></span>
  <a class="btn accent big" href="lesson.html">Start your vocal lesson</a>
</main>

<script type="module">
  import { stats } from "./store.js";
  import { drawSloths } from "./sloth.js";
  import { tabbar, greeting } from "./ui.js";
  import { buildLesson } from "./lesson.js";
  import { loadSong } from "./song.js";

  // First visit: Lento introduces herself (once more for anyone who met her as Mariah)
  let met = true;
  try { met = localStorage.getItem("lentoMet") === "1"; } catch {}
  if (!met) location.replace("welcome.html");

  const $ = (id) => document.getElementById(id);
  const s = stats(), song = loadSong();
  const minutes = buildLesson({ song }).minutes;
  const today = s.count && new Date(JSON.parse(localStorage.getItem("lentoSessions") ?? "[]").at(-1)?.at).toDateString() === new Date().toDateString();

  $("streak").textContent = `${s.streak}-day streak`;
  $("say").firstChild.textContent = today ? "You sang today! Want to go again?" : `${greeting()}! Ready to sing?`;
  $("sub").textContent = song ? `Warm-up, scales, ${song.title} and a cooldown` : "Warm-up, scales and a cooldown";
  $("meta").textContent = `About ${minutes} minutes${s.lastAccuracy !== null ? ` · last time ${s.lastAccuracy}% on pitch` : ""}`;
  if (today) $("mascot").dataset.sloth = "proud";

  drawSloths();
  tabbar("today");
</script>
</body>
</html>
